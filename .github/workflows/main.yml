name: Build Earnzo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Apply Home feed fixes
        run: node scripts/patch-home-feed.js

      - name: Apply editor upgrades
        run: node scripts/patch-editor.js

      - name: Create Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        env:
          NODE_ENV: production
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earnzo-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
